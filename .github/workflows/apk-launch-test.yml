# Open published Galaxy Tab APKs on an Android emulator (since build 137): install, tap the icon, check the app is open and
# running 20 seconds later with no crash. Started by pushing the temporary branch `apk-launch-test` (its file TAGS lists the
# releases to test), or by hand: Actions → "Test the tablet app on an Android emulator" → Run workflow.
# The release workflow runs the same check on every new APK before it publishes (see publish-release.yml).
name: Test the tablet app on an Android emulator

on:
  push:
    branches: [apk-launch-test]
  workflow_dispatch:
    inputs:
      tags:
        description: "Release tags to test, separated by spaces, e.g. v1.69-build136"
        required: true

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Which releases
        run: |
          T="${{ inputs.tags }}"; [ -z "$T" ] && T="$(cat TAGS 2>/dev/null)"
          [ -n "$T" ] || { echo "::error::No release tags given"; exit 1; }
          echo "TAGS=$T" >> "$GITHUB_ENV"; echo "Testing: $T"

      - name: Download the APKs
        run: |
          mkdir -p "$RUNNER_TEMP/apks"
          for t in $TAGS; do gh release download "$t" -R "$GITHUB_REPOSITORY" -p Mind-It-Android-Galaxy-Tab.apk -O "$RUNNER_TEMP/apks/$t.apk"; done
          ls -la "$RUNNER_TEMP/apks"

      - name: Enable the emulator's hardware acceleration (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open each APK on Android 15 (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/apk_launch_many.sh "$RUNNER_TEMP/apks" "$RUNNER_TEMP/results"

      - name: Results
        if: always()
        run: |
          found=0
          for f in "$RUNNER_TEMP"/results/*.txt; do [ -f "$f" ] || continue; found=1; t=$(basename "$f" .txt); r=$(cat "$f")
            case "$r" in ok*) echo "::notice title=$t opens on Android 15::$r";; *) echo "::error title=$t does not open on Android 15::$r";; esac
          done
          [ "$found" = 1 ] || echo "::warning title=No results::The emulator didn't run the test."

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-screenshots
          path: ${{ runner.temp }}/results/

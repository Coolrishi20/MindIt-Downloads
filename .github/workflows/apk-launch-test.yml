# Open published Galaxy Tab APKs on an Android emulator (since build 137): install, tap the icon, check the app is open and
# running 20 seconds later with no crash. Started by hand: Actions → "Test the tablet app on an Android emulator" → Run workflow
# → type the release tags; or by pushing a branch named `apk-launch-test` whose file TAGS lists them. The tag "staged" (build 142)
# tries the build waiting on release-staging instead; the whole Android log is kept with the screenshots.
# The release workflow runs the same check on every new APK before it publishes (see publish-release.yml).
name: Test the tablet app on an Android emulator

on:
  push:
    branches: [apk-launch-test]
  workflow_dispatch:
    inputs:
      tags:
        description: "Release tags to test, separated by spaces, e.g. v1.69-build136"
        required: true

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Which releases
        run: |
          T="${{ inputs.tags }}"; [ -z "$T" ] && T="$(cat TAGS 2>/dev/null)"
          [ -n "$T" ] || { echo "::error::No release tags given"; exit 1; }
          echo "TAGS=$T" >> "$GITHUB_ENV"; echo "Testing: $T"

      - name: Download the APKs
        run: |
          mkdir -p "$RUNNER_TEMP/apks"
          for t in $TAGS; do
            if [ "$t" = staged ]; then git fetch -q --depth=1 origin release-staging && git show FETCH_HEAD:staging/Mind-It-Android-Galaxy-Tab.apk > "$RUNNER_TEMP/apks/staged.apk"; continue; fi   # the build waiting on release-staging
            gh release download "$t" -R "$GITHUB_REPOSITORY" -p Mind-It-Android-Galaxy-Tab.apk -O "$RUNNER_TEMP/apks/$t.apk"; done
          ls -la "$RUNNER_TEMP/apks"

      - name: Enable the emulator's hardware acceleration (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open each APK on Android 15 (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/apk_launch_many.sh "$RUNNER_TEMP/apks" "$RUNNER_TEMP/results"

      - name: Results (a release whose app doesn't open makes this run red)
        if: always()
        run: |
          found=0; bad=0
          for f in "$RUNNER_TEMP"/results/*.txt; do [ -f "$f" ] || continue; found=1
            bash .github/scripts/apk_launch_result.sh "$f" "$(basename "$f" .txt)" block || bad=1
          done
          for f in "$RUNNER_TEMP"/results/*.save; do [ -f "$f" ] || continue   # build 141: the save check (an older APK gives a warning only)
            bash .github/scripts/apk_save_result.sh "$f" "$(basename "$f" .save)" block || bad=1
          done
          [ "$found" = 1 ] || echo "::warning title=No results::The emulator didn't run the test."
          exit $bad

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-screenshots
          path: ${{ runner.temp }}/results/

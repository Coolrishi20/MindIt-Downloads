# Publish a Mind It! build as a GitHub Release — started by the owner with one click:
#   Actions → "Publish a Mind It! release" → Run workflow → type the build number → Run workflow.
# The build's files arrive on the temporary branch `release-staging` (see RELEASING.md). Nothing is published unless
# every check passes; existing releases and tags are never changed; the previous release stays the latest on any failure.
name: Publish a Mind It! release

on:
  workflow_dispatch:
    inputs:
      build:
        description: "Build number to publish (it must be waiting on the release-staging branch), e.g. 132"
        required: true
      include_history:
        description: "Also publish the earlier verified builds 125–131 from this repository's history (first run only; already published ones are skipped)"
        type: boolean
        default: true
      remove_staging:
        description: "After a verified publish, delete the temporary release-staging branch (the files are then in the release)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD: ${{ inputs.build }}
    steps:
      - name: Check the build number
        run: |
          [[ "$BUILD" =~ ^[0-9]{2,5}$ ]] || { echo "::error::The build number must be digits only, e.g. 132"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Get the staged build
        run: |
          git fetch origin release-staging || { echo "::error::Nothing is waiting: the release-staging branch does not exist"; exit 1; }
          git worktree add "$RUNNER_TEMP/staging" FETCH_HEAD
          ls -la "$RUNNER_TEMP/staging/staging"

      - name: Validate the files (nothing is published if this fails)
        run: python3 .github/scripts/mindit_release.py validate "$RUNNER_TEMP/staging/staging" "$BUILD"

      - name: Publish the earlier builds (first run only)
        if: ${{ inputs.include_history }}
        run: python3 .github/scripts/mindit_release.py history

      - name: Publish this build as the latest release
        run: python3 .github/scripts/mindit_release.py publish "$RUNNER_TEMP/staging/staging" "$BUILD"

      - name: Download and check every file of the new release
        run: python3 .github/scripts/mindit_release.py verify "$BUILD"

      - name: Update the download section of README.md
        run: |
          python3 .github/scripts/mindit_release.py readme "$BUILD"
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "README: latest download is build $BUILD"
            git push origin HEAD:main
          fi

      - name: Remove the temporary staging branch
        if: ${{ inputs.remove_staging }}
        run: git push origin --delete release-staging
